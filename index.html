// ═══════════════════════════════════════════════════════════════════════════
//  CONFIG — paste your Supabase keys here to enable real cloud accounts.
//  Leave blank to run in Local Mode (accounts saved on this device only).
//  Get keys at: supabase.com → your project → Settings → API
// ═══════════════════════════════════════════════════════════════════════════
const SUPABASE_URL      = "";
const SUPABASE_ANON_KEY = "";

const CLOUD_MODE = Boolean(SUPABASE_URL && SUPABASE_ANON_KEY);
let supabase = null;
if (CLOUD_MODE && window.supabase) {
  supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
}

// ── DATA KEYS ────────────────────────────────────────────────────────────────
const SET_KEYS  = ['states','parks','continents','wonders','natural','oceans','countries','capitals'];
const LIST_KEYS = ['wCities','usCities','rests','bars','breweries','wineries','beers','wines',
                   'stays','beaches','lakes','rivers','islands','hikes','museums','historic',
                   'zoos','cparks','roadtrips','sports','amusement','festivals','wantItems'];

function emptyData() {
  const d = {};
  SET_KEYS.forEach(k => d[k] = []);
  LIST_KEYS.forEach(k => d[k] = []);
  return d;
}

// ── LOCAL AUTH (no Supabase) ─────────────────────────────────────────────────
const LocalAuth = {
  usersKey: 'qtl_users',
  sessionKey: 'qtl_session',

  _hash(str) {
    let h = 0;
    for (let i = 0; i < str.length; i++) { h = ((h << 5) - h) + str.charCodeAt(i); h |= 0; }
    return String(h);
  },
  _users() {
    try { return JSON.parse(localStorage.getItem(this.usersKey) || '{}'); }
    catch { return {}; }
  },
  _saveUsers(u) { localStorage.setItem(this.usersKey, JSON.stringify(u)); },

  signUp(email, password, name) {
    const users = this._users();
    const key = email.toLowerCase().trim();
    if (users[key]) return { error: 'An account with that email already exists. Try signing in.' };
    if (password.length < 6) return { error: 'Password must be at least 6 characters.' };
    users[key] = { email: key, name: name || key.split('@')[0], pw: this._hash(password), created: Date.now() };
    this._saveUsers(users);
    localStorage.setItem(this.sessionKey, key);
    return { user: { email: key, name: users[key].name } };
  },

  signIn(email, password) {
    const users = this._users();
    const key = email.toLowerCase().trim();
    const u = users[key];
    if (!u) return { error: 'No account found with that email.' };
    if (u.pw !== this._hash(password)) return { error: 'Incorrect password.' };
    localStorage.setItem(this.sessionKey, key);
    return { user: { email: key, name: u.name } };
  },

  session() {
    const key = localStorage.getItem(this.sessionKey);
    if (!key) return null;
    const u = this._users()[key];
    return u ? { email: u.email, name: u.name } : null;
  },

  signOut() { localStorage.removeItem(this.sessionKey); },

  loadData(email) {
    try { return JSON.parse(localStorage.getItem(`qtl_data_${email}`) || 'null') || emptyData(); }
    catch { return emptyData(); }
  },
  saveData(email, data) {
    try { localStorage.setItem(`qtl_data_${email}`, JSON.stringify(data)); return true; }
    catch { return false; }
  },
};

// ── UNIFIED AUTH API ─────────────────────────────────────────────────────────
const Auth = {
  async getSession() {
    if (CLOUD_MODE && supabase) {
      const { data } = await supabase.auth.getSession();
      if (!data?.session?.user) return null;
      const u = data.session.user;
      return { email: u.email, name: u.user_metadata?.name || u.user_metadata?.full_name || u.email.split('@')[0], avatar: u.user_metadata?.avatar_url || null, id: u.id };
    }
    return LocalAuth.session();
  },

  async signUp(email, password, name) {
    if (CLOUD_MODE && supabase) {
      const { data, error } = await supabase.auth.signUp({
        email, password, options: { data: { name } },
      });
      if (error) return { error: error.message };
      if (!data.session) return { needsConfirm: true };
      return { user: { email: data.user.email, name, id: data.user.id } };
    }
    return LocalAuth.signUp(email, password, name);
  },

  async signIn(email, password) {
    if (CLOUD_MODE && supabase) {
      const { data, error } = await supabase.auth.signInWithPassword({ email, password });
      if (error) return { error: error.message };
      const u = data.user;
      return { user: { email: u.email, name: u.user_metadata?.name || u.email.split('@')[0], id: u.id } };
    }
    return LocalAuth.signIn(email, password);
  },

  async signInWithGoogle() {
    if (!CLOUD_MODE || !supabase) {
      return { error: 'Google sign-in needs Cloud Mode. See the README for Supabase setup.' };
    }
    const { error } = await supabase.auth.signInWithOAuth({
      provider: 'google',
      options: {
        redirectTo: window.location.origin + window.location.pathname,
        queryParams: { access_type: 'offline', prompt: 'select_account' },
      },
    });
    if (error) return { error: error.message };
    return { redirecting: true };   // browser navigates away to Google
  },

  // Fires when the OAuth redirect lands back on the page.
  onAuthChange(cb) {
    if (!CLOUD_MODE || !supabase) return () => {};
    const { data } = supabase.auth.onAuthStateChange((event, session) => {
      if (session?.user) {
        const u = session.user;
        cb({
          email: u.email,
          name: u.user_metadata?.name || u.user_metadata?.full_name || u.email.split('@')[0],
          avatar: u.user_metadata?.avatar_url || null,
          id: u.id,
        });
      } else if (event === 'SIGNED_OUT') {
        cb(null);
      }
    });
    return () => data?.subscription?.unsubscribe();
  },

  async signOut() {
    if (CLOUD_MODE && supabase) await supabase.auth.signOut();
    else LocalAuth.signOut();
  },

  async loadData(user) {
    if (CLOUD_MODE && supabase) {
      const { data, error } = await supabase
        .from('travel_data').select('data').eq('user_id', user.id).maybeSingle();
      if (error || !data) return emptyData();
      return { ...emptyData(), ...(data.data || {}) };
    }
    return LocalAuth.loadData(user.email);
  },

  async saveData(user, data) {
    if (CLOUD_MODE && supabase) {
      const { error } = await supabase
        .from('travel_data')
        .upsert({ user_id: user.id, data, updated_at: new Date().toISOString() },
                { onConflict: 'user_id' });
      return !error;
    }
    return LocalAuth.saveData(user.email, data);
  },
};

// ── AUTH SCREEN ──────────────────────────────────────────────────────────────
function AuthScreen({ onAuth }) {
  const [mode, setMode]       = useState('signin');
  const [email, setEmail]     = useState('');
  const [pw, setPw]           = useState('');
  const [name, setName]       = useState('');
  const [err, setErr]         = useState('');
  const [msg, setMsg]         = useState('');
  const [busy, setBusy]       = useState(false);

  const googleSignIn = async () => {
    setErr(''); setMsg(''); setBusy(true);
    const res = await Auth.signInWithGoogle();
    if (res.error) { setErr(res.error); setBusy(false); return; }
    // On success the browser redirects to Google; onAuthChange picks it up on return.
  };

  const submit = async () => {
    setErr(''); setMsg('');
    if (!email.trim() || !pw) { setErr('Email and password are required.'); return; }
    setBusy(true);
    const res = mode === 'signup'
      ? await Auth.signUp(email, pw, name)
      : await Auth.signIn(email, pw);
    setBusy(false);
    if (res.error) { setErr(res.error); return; }
    if (res.needsConfirm) { setMsg('Check your email to confirm your account, then sign in.'); setMode('signin'); return; }
    onAuth(res.user);
  };

  const IS = {
    width:'100%', padding:'11px 14px', borderRadius:9,
    border:`1.5px solid ${C.border}`, background:C.surface2,
    color:C.text, fontSize:'0.9rem', outline:'none', marginBottom:10,
  };

  return (
    <div style={{
      minHeight:'100vh', background:'linear-gradient(160deg,#0f1f0f 0%,#1c2b1c 50%,#16281a 100%)',
      display:'flex', alignItems:'center', justifyContent:'center', padding:20,
    }}>
      <div style={{ width:'100%', maxWidth:400 }}>

        {/* Logo */}
        <div style={{ textAlign:'center', marginBottom:28 }}>
          <div style={{ fontSize:'2.6rem', marginBottom:8 }}>🗺️</div>
          <h1 style={{ fontFamily:"'Playfair Display',serif", fontSize:'1.8rem', color:C.text, marginBottom:4 }}>
            Quail's Travel Log
          </h1>
          <div style={{ fontFamily:"'Playfair Display',serif", fontStyle:'italic', fontSize:'0.9rem', color:C.textMuted }}>
            Guide to the Galaxy
          </div>
        </div>

        {/* Card */}
        <div style={{
          background:C.surface, borderRadius:14, border:`1px solid ${C.border}`,
          padding:26, boxShadow:'0 12px 40px rgba(0,0,0,0.4)',
        }}>
          {/* Tabs */}
          <div style={{ display:'flex', gap:4, marginBottom:20, background:C.surface2, borderRadius:9, padding:4 }}>
            {[{id:'signin',l:'Sign In'},{id:'signup',l:'Create Account'}].map(t => (
              <button key={t.id} onClick={() => { setMode(t.id); setErr(''); setMsg(''); }} style={{
                flex:1, padding:'9px', border:'none', borderRadius:7, cursor:'pointer',
                background: mode===t.id ? C.green : 'transparent',
                color: mode===t.id ? '#fff' : C.textMuted,
                fontSize:'0.85rem', fontWeight: mode===t.id?600:400,
                transition:'all 0.15s', fontFamily:'inherit',
              }}>{t.l}</button>
            ))}
          </div>

          {/* Google sign-in */}
          <button onClick={googleSignIn} disabled={busy || !CLOUD_MODE} title={CLOUD_MODE ? '' : 'Requires Supabase Cloud Mode'} style={{
            width:'100%', display:'flex', alignItems:'center', justifyContent:'center', gap:10,
            background: CLOUD_MODE ? '#fff' : '#2a3a2a',
            color: CLOUD_MODE ? '#3c4043' : C.textDim,
            border: CLOUD_MODE ? 'none' : `1px solid ${C.border}`,
            borderRadius:9, padding:'11px', fontSize:'0.9rem', fontWeight:600,
            cursor: (busy || !CLOUD_MODE) ? 'default' : 'pointer', fontFamily:'inherit',
            marginBottom:6, transition:'all 0.15s',
            opacity: CLOUD_MODE ? 1 : 0.55,
          }}>
            <svg width="18" height="18" viewBox="0 0 48 48" style={{flexShrink:0}}>
              <path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/>
              <path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/>
              <path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/>
              <path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/>
            </svg>
            Continue with Google
          </button>

          {!CLOUD_MODE && (
            <div style={{fontSize:'0.7rem',color:C.textDim,textAlign:'center',marginBottom:12,lineHeight:1.4}}>
              Google sign-in turns on once Supabase is connected
            </div>
          )}

          {/* Divider */}
          <div style={{display:'flex',alignItems:'center',gap:12,margin:'14px 0 16px'}}>
            <div style={{flex:1,height:1,background:C.border}}/>
            <span style={{fontSize:'0.7rem',color:C.textDim,letterSpacing:'0.08em'}}>OR</span>
            <div style={{flex:1,height:1,background:C.border}}/>
          </div>

          {mode === 'signup' && (
            <>
              <label style={{fontSize:'0.7rem',color:C.textMuted,textTransform:'uppercase',letterSpacing:'0.07em',display:'block',marginBottom:5}}>Your Name</label>
              <input value={name} onChange={e=>setName(e.target.value)} placeholder="Claire" style={IS}
                onKeyDown={e=>e.key==='Enter'&&submit()}/>
            </>
          )}

          <label style={{fontSize:'0.7rem',color:C.textMuted,textTransform:'uppercase',letterSpacing:'0.07em',display:'block',marginBottom:5}}>Email</label>
          <input type="email" value={email} onChange={e=>setEmail(e.target.value)} placeholder="you@example.com" style={IS}
            onKeyDown={e=>e.key==='Enter'&&submit()}/>

          <label style={{fontSize:'0.7rem',color:C.textMuted,textTransform:'uppercase',letterSpacing:'0.07em',display:'block',marginBottom:5}}>Password</label>
          <input type="password" value={pw} onChange={e=>setPw(e.target.value)} placeholder="At least 6 characters" style={IS}
            onKeyDown={e=>e.key==='Enter'&&submit()}/>

          {err && (
            <div style={{background:'rgba(200,60,40,0.12)',border:'1px solid rgba(200,60,40,0.3)',color:'#e08070',borderRadius:8,padding:'9px 12px',fontSize:'0.82rem',marginBottom:12}}>
              {err}
            </div>
          )}
          {msg && (
            <div style={{background:'rgba(90,154,64,0.12)',border:`1px solid ${C.green}`,color:C.greenHi,borderRadius:8,padding:'9px 12px',fontSize:'0.82rem',marginBottom:12}}>
              {msg}
            </div>
          )}

          <button onClick={submit} disabled={busy} style={{
            width:'100%', background: busy ? C.border : C.green, color:'#fff', border:'none',
            borderRadius:9, padding:'12px', fontSize:'0.92rem', fontWeight:600,
            cursor: busy ? 'default' : 'pointer', marginTop:4, fontFamily:'inherit',
            transition:'background 0.15s',
          }}>
            {busy ? 'Just a moment…' : mode === 'signup' ? 'Create My Account' : 'Sign In'}
          </button>
        </div>

        {/* Mode badge */}
        <div style={{
          marginTop:16, textAlign:'center', fontSize:'0.72rem', color:C.textDim,
          background:C.surface2, border:`1px solid ${C.border}`, borderRadius:8, padding:'10px 14px',
        }}>
          {CLOUD_MODE
            ? '☁️  Cloud sync on — your travels save to your account on any device'
            : '📱  Local mode — your travels save in this browser on this device'}
        </div>
      </div>
    </div>
  );
}

// ── TOPOJSON LOADER ──────────────────────────────────────────────────────────
let topoPromise = null;
function loadTopojson() {
  if (!topoPromise) {
    topoPromise = new Promise((resolve, reject) => {
      if (window.topojson) { resolve(window.topojson); return; }
      const s = document.createElement('script');
      s.src = 'https://cdn.jsdelivr.net/npm/topojson-client@3/dist/topojson-client.min.js';
      s.onload = () => resolve(window.topojson);
      s.onerror = reject;
      document.head.appendChild(s);
    });
  }
  return topoPromise;
}

// ── US MAP ───────────────────────────────────────────────────────────────────
function USChoroplethMap({ visited, onToggle }) {
  const [features, setFeatures] = useState([]);
  const [loading, setLoading]   = useState(true);
  const [tooltip, setTooltip]   = useState(null);
  const W = 960, H = 600;
  useEffect(() => {
    let alive = true;
    (async () => {
      try {
        const topo = await loadTopojson();
        const us   = await fetch('https://cdn.jsdelivr.net/npm/us-atlas@3/states-10m.json').then(r => r.json());
        if (!alive) return;
        const geo  = topo.feature(us, us.objects.states);
        const proj = d3.geoAlbersUsa().fitSize([W, H], geo);
        const path = d3.geoPath().projection(proj);
        setFeatures(geo.features.map(f => {
          const id   = String(f.id).padStart(2, '0');
          const abbr = STATE_FIPS[id];
          return { id, abbr, name: STATE_NAMES[abbr] || abbr, d: path(f), centroid: path.centroid(f) };
        }).filter(f => f.d));
        setLoading(false);
      } catch(e) { setLoading(false); }
    })();
    return () => { alive = false; };
  }, []);
  if (loading) return <div style={{textAlign:'center',padding:60,color:C.textMuted}}>🗺️<br/>Loading US map…</div>;
  return (
    <div style={{position:'relative'}}>
      {tooltip && (
        <div style={{position:'absolute',top:8,left:'50%',transform:'translateX(-50%)',background:C.surface,border:`1px solid ${C.borderHi}`,borderRadius:8,padding:'6px 14px',fontSize:'0.85rem',color:C.text,pointerEvents:'none',zIndex:10,boxShadow:'0 4px 16px rgba(0,0,0,0.4)',whiteSpace:'nowrap'}}>
          {tooltip.name} {visited.has(tooltip.abbr) ? '✓' : ''}
        </div>
      )}
      <svg viewBox={`0 0 ${W} ${H}`} style={{width:'100%',height:'auto',display:'block'}}>
        {features.map(f => {
          const done = visited.has(f.abbr);
          return (
            <g key={f.id} onMouseEnter={() => setTooltip(f)} onMouseLeave={() => setTooltip(null)} onClick={() => f.abbr && onToggle(f.abbr)} style={{cursor:'pointer'}}>
              <path d={f.d} style={{fill:done?C.rust:'#2a3d2a',stroke:'#1c2b1c',strokeWidth:0.8,transition:'fill 0.2s'}}/>
              {f.centroid && f.abbr && (
                <text x={f.centroid[0]} y={f.centroid[1]} style={{fill:done?'#fff':C.textDim,fontSize:8,fontWeight:700,textAnchor:'middle',dominantBaseline:'middle',pointerEvents:'none'}}>
                  {f.abbr}
                </text>
              )}
            </g>
          );
        })}
      </svg>
      <p style={{textAlign:'center',fontSize:'0.72rem',color:C.textMuted,marginTop:4}}>Click any state to mark visited</p>
    </div>
  );
}

// ── PARK CARD ────────────────────────────────────────────────────────────────
function ParkCard({ park, visited, onToggle }) {
  const [img, setImg]         = useState(null);
  const [imgLoaded, setLoaded]= useState(false);
  const done = visited.has(park.name);
  const hash = park.name.split('').reduce((a,c) => a + c.charCodeAt(0), 0);
  const hue  = (hash * 37) % 360;
  useEffect(() => {
    fetch(`https://en.wikipedia.org/w/api.php?action=query&titles=${encodeURIComponent(park.wiki)}&prop=pageimages&format=json&pithumbsize=500&origin=*`)
      .then(r => r.json()).then(data => {
        const page = Object.values(data?.query?.pages || {})[0];
        if (page?.thumbnail?.source) setImg(page.thumbnail.source);
      }).catch(() => {});
  }, [park.wiki]);
  return (
    <div onClick={() => onToggle(park.name)} style={{borderRadius:10,overflow:'hidden',cursor:'pointer',border:`2px solid ${done?C.greenHi:C.border}`,transition:'all 0.15s',boxShadow:done?`0 0 16px rgba(138,184,112,0.3)`:'none'}}>
      <div style={{height:130,background:`linear-gradient(135deg,hsl(${hue},35%,18%),hsl(${(hue+50)%360},45%,28%))`,position:'relative',overflow:'hidden'}}>
        {img && <img src={img} alt={park.name} onLoad={() => setLoaded(true)} style={{width:'100%',height:'100%',objectFit:'cover',opacity:imgLoaded?1:0,transition:'opacity 0.4s',display:'block'}}/>}
        {done && (
          <div style={{position:'absolute',inset:0,background:'rgba(90,154,64,0.45)',display:'flex',alignItems:'center',justifyContent:'center'}}>
            <div style={{width:40,height:40,borderRadius:'50%',background:C.green,display:'flex',alignItems:'center',justifyContent:'center',fontSize:'1.2rem'}}>✓</div>
          </div>
        )}
        <div style={{position:'absolute',top:6,right:6,background:'rgba(28,43,28,0.75)',borderRadius:4,padding:'2px 6px',fontSize:'0.65rem',color:C.textMuted,fontWeight:600}}>{park.state}</div>
      </div>
      <div style={{background:done?'rgba(90,154,64,0.15)':C.surface2,padding:'8px 10px'}}>
        <div style={{fontSize:'0.82rem',fontWeight:600,color:done?C.greenHi:C.text,lineHeight:1.3}}>{park.name}</div>
        <div style={{fontSize:'0.68rem',color:C.textMuted,marginTop:2}}>National Park</div>
      </div>
    </div>
  );

function ParkGrid({ visited, onToggle }) {

function SearchableChecklist({items,visited,onToggle,label,color=C.greenHi,renderRow}){
  const [search,setSearch]=useState('');
  const [filter,setFilter]=useState('all');
  const IS={padding:'8px 12px',borderRadius:8,border:`1.5px solid ${C.border}`,background:C.surface2,color:C.text,fontSize:'0.875rem',outline:'none'};
  const filtered=items.filter(item=>{
    const text=(typeof item==='string'?item:Object.values(item).join(' ')).toLowerCase();
    const ms=text.includes(search.toLowerCase());
    const key=typeof item==='string'?item:(item.capital||item);
    const mf=filter==='all'||(filter==='done'&&visited.has(key))||(filter==='todo'&&!visited.has(key));
    return ms&&mf;
  });
  return(
    <div>
      <div style={{display:'flex',gap:8,marginBottom:12,flexWrap:'wrap'}}>
        <input placeholder={`Search ${label}...`} value={search} onChange={e=>setSearch(e.target.value)} style={{...IS,flex:1,minWidth:150}}/>
        <select value={filter} onChange={e=>setFilter(e.target.value)} style={{...IS,width:130}}>
          <option value="all">All</option><option value="done">Visited</option><option value="todo">Not Yet</option>
        </select>
      </div>
      <div style={{background:C.surface2,borderRadius:10,border:`1px solid ${C.border}`,overflow:'hidden'}}>
        {filtered.map((item,i)=>{
          const key=typeof item==='string'?item:(item.capital||item);
          const done=visited.has(key);
          return(
            <div key={key} onClick={()=>onToggle(key)} style={{display:'flex',alignItems:'center',gap:12,padding:'10px 14px',cursor:'pointer',borderBottom:i<filtered.length-1?`1px solid ${C.border}`:'none',background:done?'rgba(90,154,64,0.06)':'transparent',transition:'background 0.1s'}}>
              <div style={{width:20,height:20,borderRadius:4,flexShrink:0,border:`2px solid ${done?color:C.textDim}`,background:done?color:'transparent',display:'flex',alignItems:'center',justifyContent:'center',transition:'all 0.15s'}}>
                {done&&<span style={{color:'#fff',fontSize:'0.65rem',fontWeight:700}}>✓</span>}
              </div>
              <div style={{flex:1}}>{renderRow?renderRow(item,done):<span style={{fontSize:'0.88rem',color:done?color:C.text,fontWeight:done?600:400}}>{key}</span>}</div>
              {done&&<span style={{fontSize:'0.63rem',background:'rgba(90,154,64,0.15)',color,borderRadius:10,padding:'2px 8px',fontWeight:600}}>VISITED</span>}
            </div>
          );
        })}
        {!filtered.length&&<div style={{padding:28,textAlign:'center',color:C.textMuted,fontSize:'0.875rem'}}>No results</div>}
      </div>
    </div>
  );
}
function AddEntryForm({title,fields,onAdd,onCancel}){
  const [form,setForm]=useState(Object.fromEntries(fields.map(f=>[f.key,f.default||''])));
  const set=(k,v)=>setForm(f=>({...f,[k]:v}));
  const IS={width:'100%',padding:'8px 12px',borderRadius:8,border:`1.5px solid ${C.border}`,background:C.surface2,color:C.text,fontSize:'0.875rem',outline:'none'};
  return(
    <div style={{background:C.surface,borderRadius:10,border:`1.5px solid ${C.borderHi}`,padding:18,marginBottom:16}}>
      <div style={{fontSize:'0.95rem',color:C.text,fontWeight:600,marginBottom:14}}>{title}</div>
      <div style={{display:'grid',gridTemplateColumns:'repeat(auto-fill,minmax(180px,1fr))',gap:10,marginBottom:14}}>
        {fields.map(f=>(
          <div key={f.key}>
            <label style={{fontSize:'0.68rem',color:C.textMuted,letterSpacing:'0.06em',textTransform:'uppercase',display:'block',marginBottom:4}}>{f.label}</label>
            {f.type==='select'?(<select value={form[f.key]} onChange={e=>set(f.key,e.target.value)} style={IS}><option value="">Select...</option>{f.options&&f.options.map(o=><option key={o}>{o}</option>)}</select>)
            :f.type==='textarea'?(<textarea rows={2} value={form[f.key]} onChange={e=>set(f.key,e.target.value)} placeholder={f.placeholder||''} style={{...IS,resize:'vertical'}}/>)
            :(<input type={f.type||'text'} value={form[f.key]} onChange={e=>set(f.key,e.target.value)} placeholder={f.placeholder||''} style={IS}/>)}
          </div>
        ))}
      </div>
      <div style={{display:'flex',gap:10}}>
        <button onClick={()=>{if(!form[fields[0].key]?.trim())return;onAdd({...form,id:Date.now()});}} style={{background:C.green,color:'#fff',border:'none',borderRadius:8,padding:'8px 20px',fontWeight:600,fontSize:'0.875rem',cursor:'pointer'}}>+ Save</button>
        <button onClick={onCancel} style={{background:'transparent',color:C.textMuted,border:`1.5px solid ${C.border}`,borderRadius:8,padding:'7px 16px',fontSize:'0.875rem',cursor:'pointer'}}>Cancel</button>
      </div>
    </div>
  );
}

    states:setVstStates,parks:setVstParks,continents:setVstConts,wonders:setVstWonders,

    historic:setHistoric,zoos:setZoos,cparks:setCparks,roadtrips:setRoadtrips,
    sports:setSports,amusement:setAmusement,festivals:setFestivals,wantItems:setWantItems,
  };

  useEffect(()=>{
    let alive=true;
    (async()=>{
      const d=await Auth.loadData(user);
      if(!alive)return;
      SET_KEYS.forEach(k=>{ if(setters[k]&&Array.isArray(d[k])) setters[k](new Set(d[k])); });
      LIST_KEYS.forEach(k=>{ if(setters[k]&&Array.isArray(d[k])) setters[k](d[k]); });
      setLoaded(true);
    })();
    return()=>{alive=false;};
  },[]);

  // ── SAVE (debounced) whenever anything changes ──────────────────────────
  const current={
    states:[...vstStates],parks:[...vstParks],continents:[...vstConts],wonders:[...vstWonders],
    natural:[...vstNatural],oceans:[...vstOceans],countries:[...vstCountries],capitals:[...vstCapitals],

    islands,hikes,museums,historic,zoos,cparks,roadtrips,sports,amusement,festivals,wantItems,
  };
  const snapshot=JSON.stringify(current);
  const firstSave=useRef(true);

  useEffect(()=>{
    if(!loaded)return;
    if(firstSave.current){firstSave.current=false;return;}

      const ok=await Auth.saveData(user,JSON.parse(snapshot));

        {natSub==='lakes'&&<FreeFormSection list={lakes} setter={setLakes} sKey="lakes" addingTo={addingTo} setAddingTo={setAddingTo} title="Lake" fields={LF('Lake')} showRating/>}
        {natSub==='rivers'&&<FreeFormSection list={rivers} setter={setRivers} sKey="rivers" addingTo={addingTo} setAddingTo={setAddingTo} title="River" fields={LF('River')} showRating/>}
        {natSub==='islands'&&<FreeFormSection list={islands} setter={setIslands} sKey="islands" addingTo={addingTo} setAddingTo={setAddingTo} title="Island" fields={LF('Island')} showRating/>}
        {natSub==='hikes'&&<FreeFormSection list={hikes} setter={setHikes} sKey="hikes" addingTo={addingTo} setAddingTo={setAddingTo} title="Hike" fields={[{key:'name',label:'Trail Name',placeholder:'e.g. Angels Landing'},{key:'state',label:'Park / Location',placeholder:'Zion NP, UT'},{key:'date',label:'When',type:'month'},{key:'rating',label:'Rating',placeholder:'5'},{key:'notes',label:'Notes',type:'textarea'}]} showRating/>}
        {natSub==='oceans'&&<><div style={{marginBottom:14}}><ProgressBar value={vstOceans.size} max={OCEANS_SEAS.length} color={C.blue}/></div><SearchableChecklist items={OCEANS_SEAS} visited={vstOceans} onToggle={tog(setVstOceans)} label="Oceans" color={C.blue}/></>}
      </div>
    </>
  );
  const renderCulture=()=>(
    <>
      <SubTabs tabs={[{id:'museums',label:'Museums'},{id:'historic',label:'Historic Sites'},{id:'zoos',label:'Zoos & Aquariums'},{id:'cparks',label:'City Parks'},{id:'roadtrips',label:'Road Trips'}]} active={cultSub} setActive={t=>{setCultSub(t);setAddingTo(null);}}/>
      <div style={{marginTop:16}}>
        {cultSub==='museums'&&<FreeFormSection list={museums} setter={setMuseums} sKey="museums" addingTo={addingTo} setAddingTo={setAddingTo} title="Museum / Gallery" fields={LF('Museum')} showRating/>}
        {cultSub==='historic'&&<FreeFormSection list={historic} setter={setHistoric} sKey="historic" addingTo={addingTo} setAddingTo={setAddingTo} title="Historic Site" fields={LF('Site')} showRating/>}
        {cultSub==='zoos'&&<FreeFormSection list={zoos} setter={setZoos} sKey="zoos" addingTo={addingTo} setAddingTo={setAddingTo} title="Zoo / Aquarium" fields={LF('Zoo')} showRating/>}
        {cultSub==='cparks'&&<FreeFormSection list={cparks} setter={setCparks} sKey="cparks" addingTo={addingTo} setAddingTo={setAddingTo} title="City Park / Garden" fields={LF('Park')} showRating/>}
        {cultSub==='roadtrips'&&<FreeFormSection list={roadtrips} setter={setRoadtrips} sKey="roadtrips" addingTo={addingTo} setAddingTo={setAddingTo} title="Road Trip" fields={[{key:'name',label:'Route Name',placeholder:'e.g. Pacific Coast Hwy'},{key:'state',label:'States / Region',placeholder:'CA, OR, WA'},{key:'date',label:'When',type:'month'},{key:'rating',label:'Rating',placeholder:'5'},{key:'notes',label:'Highlights',type:'textarea'}]} showRating/>}
      </div>
    </>
  );
  const renderEvents=()=>(
    <>
      <SubTabs tabs={[{id:'sports',label:'Sporting Events'},{id:'amusement',label:'Amusement Parks'},{id:'festivals',label:'Festivals & Fairs'}]} active={evtSub} setActive={t=>{setEvtSub(t);setAddingTo(null);}}/>
      <div style={{marginTop:16}}>
        {evtSub==='sports'&&<FreeFormSection list={sports} setter={setSports} sKey="sports" addingTo={addingTo} setAddingTo={setAddingTo} title="Sporting Event" fields={LF('Event')} showRating/>}
        {evtSub==='amusement'&&<FreeFormSection list={amusement} setter={setAmusement} sKey="amusement" addingTo={addingTo} setAddingTo={setAddingTo} title="Amusement Park" fields={LF('Park')} showRating/>}
        {evtSub==='festivals'&&<FreeFormSection list={festivals} setter={setFestivals} sKey="festivals" addingTo={addingTo} setAddingTo={setAddingTo} title="Festival / Fair" fields={LF('Event')} showRating/>}
      </div>
    </>
  );
  const renderWantToGo=()=>{
    const cat=wantSub;
    const items=wantItems.filter(i=>i.cat===cat);
    return(
      <>
        <GoogleMapsPanel/>
        <SubTabs tabs={[{id:'eat',label:'🍽️ Eat'},{id:'stay',label:'🛏️ Stay'},{id:'bars',label:'🍺 Bars'},{id:'beaches',label:'🏖️ Beaches'},{id:'camp',label:'⛺ Camp'},{id:'outdoor',label:'🥾 Outdoors'},{id:'kids',label:'👧 Kids'},{id:'drives',label:'🚗 Drives'},{id:'other',label:'📍 Other'}]} active={wantSub} setActive={t=>{setWantSub(t);setAddingTo(null);}}/>
        <div style={{marginTop:16}}>
          {addingTo===`w_${cat}`?<AddEntryForm title="Add to Wishlist" onCancel={()=>setAddingTo(null)} onAdd={e=>{setWantItems(l=>[...l,{...e,cat,id:Date.now()}]);setAddingTo(null);}} fields={[{key:'name',label:'Name / Place'},{key:'city',label:'City'},{key:'state',label:'State / Country'},{key:'notes',label:'Why / Notes',type:'textarea',placeholder:'Who recommended it...'}]}/>:<AddBtn onClick={()=>setAddingTo(`w_${cat}`)} label="+ Add to Wishlist"/>}
          <EntryList items={items} onDelete={id=>setWantItems(l=>l.filter(i=>i.id!==id))} renderItem={e=>(
            <><div style={{fontSize:'0.93rem',color:C.text,fontWeight:600,paddingRight:24}}>{e.name}</div>
            {(e.city||e.state)&&<div style={{fontSize:'0.73rem',color:C.textMuted,marginTop:3}}>{[e.city,e.state].filter(Boolean).join(', ')}</div>}
            {e.notes&&<div style={{fontSize:'0.78rem',color:C.textMuted,marginTop:5,fontStyle:'italic'}}>"{e.notes}"</div>}</>
          )}/>
        </div>
      </>
    );
  };

  const beenTabs=[{id:'us',label:'🇺🇸 US',color:C.rust},{id:'world',label:'🌍 World',color:C.teal},{id:'eat',label:'🍽️ Eat & Drink',color:C.gold},{id:'nature',label:'🌊 Nature',color:C.blue},{id:'culture',label:'🏛️ Culture',color:C.purple},{id:'events',label:'🎉 Events',color:C.greenHi}];

  return(
    <div style={{background:C.bg,minHeight:'100vh',color:C.text,fontFamily:'system-ui,sans-serif'}}>
      <header style={{background:'linear-gradient(135deg,#0f1f0f,#1c3018)',borderBottom:`1px solid ${C.border}`,padding:'16px 20px 14px'}}>
        <div style={{maxWidth:960,margin:'0 auto'}}>
          <div style={{display:'flex',alignItems:'flex-start',justifyContent:'space-between',gap:12,flexWrap:'wrap'}}>
            <h1 style={{fontFamily:"'Playfair Display',serif",fontSize:'1.55rem',color:C.text,margin:0}}>
              Quail's Travel Log <span style={{fontStyle:'italic',fontSize:'0.88rem',color:C.textMuted}}>· Guide to the Galaxy</span>
            </h1>
            <div style={{display:'flex',alignItems:'center',gap:10}}>
              {saveState && (
                <span style={{fontSize:'0.72rem',color:saveState==='saved'?C.greenHi:saveState==='error'?'#e08070':C.textMuted,whiteSpace:'nowrap'}}>
                  {saveState==='saving'?'Saving…':saveState==='saved'?'✓ Saved':'⚠ Save failed'}
                </span>
              )}
              <div style={{display:'flex',alignItems:'center',gap:7}}>
                {user.avatar
                  ? <img src={user.avatar} alt="" referrerPolicy="no-referrer" style={{width:24,height:24,borderRadius:'50%',border:`1px solid ${C.border}`}}/>
                  : <div style={{width:24,height:24,borderRadius:'50%',background:C.green,display:'flex',alignItems:'center',justifyContent:'center',fontSize:'0.7rem',fontWeight:700,color:'#fff'}}>
                      {(user.name||'?').charAt(0).toUpperCase()}
                    </div>}
                <span style={{fontSize:'0.78rem',color:C.textMuted,whiteSpace:'nowrap'}}>
                  {user.name}
                </span>
              </div>
              <button onClick={onSignOut} style={{
                background:'transparent',border:`1px solid ${C.border}`,color:C.textMuted,
                borderRadius:7,padding:'4px 11px',fontSize:'0.75rem',cursor:'pointer',
                fontFamily:'inherit',whiteSpace:'nowrap',
              }}>Sign Out</button>
            </div>
          </div>
          <div style={{display:'flex',flexWrap:'wrap',gap:16,marginTop:10}}>
            {[{e:'🏛️',l:`${vstStates.size}/50 States`,c:C.rust},{e:'🏔️',l:`${vstParks.size}/63 Parks`,c:C.greenHi},{e:'🌍',l:`${vstCountries.size} Countries`,c:C.teal},{e:'📍',l:`${totalPlaces} Total`,c:C.gold}].map(s=>(
              <div key={s.l} style={{display:'flex',alignItems:'center',gap:5}}><span>{s.e}</span><span style={{fontSize:'0.78rem',color:s.c,fontWeight:600}}>{s.l}</span></div>
            ))}
          </div>
        </div>
      </header>
      <div style={{background:'#111e11',borderBottom:`1px solid ${C.border}`,position:'sticky',top:0,zIndex:20}}>
        <div style={{maxWidth:960,margin:'0 auto',display:'flex'}}>
          {[{id:'been',label:'✅ Been There'},{id:'want',label:'📌 Want to Go'},{id:'tips',label:'📖 Travel Tips'}].map(t=>(
            <button key={t.id} onClick={()=>{setMainTab(t.id);setAddingTo(null);}} style={{flex:1,padding:'13px 8px',border:'none',cursor:'pointer',fontSize:'0.85rem',fontWeight:mainTab===t.id?600:400,background:mainTab===t.id?C.surface:'transparent',color:mainTab===t.id?C.text:C.textMuted,borderBottom:mainTab===t.id?`2px solid ${C.greenHi}`:'2px solid transparent',transition:'all 0.15s'}}>{t.label}</button>
          ))}
        </div>
      </div>
      <div style={{maxWidth:960,margin:'0 auto',padding:'20px 16px 60px'}}>
        {mainTab==='been'&&<>
          <div style={{display:'flex',gap:6,flexWrap:'wrap',marginBottom:18}}>
            {beenTabs.map(t=><button key={t.id} onClick={()=>{setBeenSec(t.id);setAddingTo(null);}} style={{padding:'7px 14px',borderRadius:20,border:'none',cursor:'pointer',background:beenSec===t.id?t.color:C.surface2,color:beenSec===t.id?'#fff':C.textMuted,fontSize:'0.82rem',fontWeight:beenSec===t.id?600:400,transition:'all 0.15s'}}>{t.label}</button>)}
          </div>
          {beenSec==='us'&&renderUS()}{beenSec==='world'&&renderWorld()}{beenSec==='eat'&&renderEatDrink()}{beenSec==='nature'&&renderNature()}{beenSec==='culture'&&renderCulture()}{beenSec==='events'&&renderEvents()}
        </>}
        {mainTab==='want'&&renderWantToGo()}
        {mainTab==='tips'&&(
          <div>
            <div style={{fontFamily:"'Playfair Display',serif",fontSize:'1.3rem',color:C.text,marginBottom:4,fontStyle:'italic'}}>Quail's Guide to the Galaxy ✈️</div>
            <div style={{fontSize:'0.85rem',color:C.textMuted,marginBottom:24}}>Travel smarter. Stress less. See more.</div>
            {TRAVEL_TIPS.map(sec=>(
              <div key={sec.heading} style={{marginBottom:28}}>
                <div style={{fontSize:'1.05rem',color:sec.color,fontWeight:700,marginBottom:12}}>{sec.heading}</div>
                {sec.tips.map(tip=>(
                  <div key={tip.title} style={{borderLeft:`3px solid ${sec.color}`,paddingLeft:16,marginBottom:14}}>
                    <div style={{fontSize:'0.9rem',fontWeight:600,color:C.text,marginBottom:4}}>{tip.title}</div>
                    <div style={{fontSize:'0.85rem',color:C.textMuted,lineHeight:1.6}}>{tip.body}</div>
                  </div>
                ))}
              </div>
            ))}
          </div>
        )}
      </div>
    </div>
  );
}

function App(){
  const [user,setUser]=useState(null);
  const [checking,setChecking]=useState(true);

  useEffect(()=>{
    let alive=true;

    // Picks up the session after a Google OAuth redirect lands back here.
    const unsub=Auth.onAuthChange(u=>{
      if(alive){ setUser(u); setChecking(false); }
    });

    (async()=>{
      const s=await Auth.getSession();
      if(alive){ setUser(s); setChecking(false); }
    })();

    return()=>{ alive=false; unsub(); };
  },[]);

  const signOut=async()=>{ await Auth.signOut(); setUser(null); };

  if(checking) return (
    <div style={{minHeight:'100vh',background:C.bg,display:'flex',alignItems:'center',
      justifyContent:'center',color:C.textMuted,fontSize:'0.9rem'}}>
      Loading your travels…
    </div>
  );

  if(!user) return <AuthScreen onAuth={setUser}/>;

  return <TravelLog key={user.email} user={user} onSignOut={signOut}/>;
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
